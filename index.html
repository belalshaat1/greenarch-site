<script>

/* ---- tiny template runtime (replaces the design-canvas engine) ---- */
(function () {
  var app = document.getElementById('ga-app');
  var tplRoot = document.getElementById('ga-tpl').content;
  var hoverSheet = document.getElementById('ga-hover').sheet;
  var hoverMap = Object.create(null), hoverN = 0;
  var bindings = [];

  function hoverClass(css) {
    if (hoverMap[css]) return hoverMap[css];
    var cls = 'ga-h' + (++hoverN);
    var decls = css.split(';').map(function (d) {
      d = d.trim();
      if (!d) return '';
      return d.indexOf('!important') > -1 ? d : d + ' !important';
    }).filter(Boolean).join(';');
    try { hoverSheet.insertRule('.' + cls + ':hover{' + decls + '}', hoverSheet.cssRules.length); } catch (e) {}
    hoverMap[css] = cls;
    return cls;
  }

  function ev(scope, expr) {
    expr = String(expr).trim();
    if (expr === 'false') return false;
    if (expr === 'true') return true;
    var parts = expr.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++) {
      if (v == null) return undefined;
      v = v[parts[i]];
    }
    return v;
  }
  function bare(v) { var m = /^\s*\{\{([\s\S]*)\}\}\s*$/.exec(v); return m ? m[1] : v; }
  function interp(str, scope) {
    return str.replace(/\{\{([^}]*)\}\}/g, function (_, e) {
      var v = ev(scope, e);
      return v == null || v === false ? '' : String(v);
    });
  }
  function makeScope(vals, chain) {
    var scope = vals;
    for (var i = 0; i < chain.length; i++) {
      var link = chain[i];
      var arr = ev(scope, link.list) || [];
      var child = Object.create(scope);
      child[link.as] = arr[link.index];
      scope = child;
    }
    return scope;
  }

  function renderNodes(srcNodes, chain, vals) {
    var frag = document.createDocumentFragment();
    var scope = makeScope(vals, chain);
    for (var i = 0; i < srcNodes.length; i++) {
      var src = srcNodes[i];
      if (src.nodeType === 3) {
        var txt = src.nodeValue;
        if (txt.indexOf('{{') > -1) {
          var tn = document.createTextNode(interp(txt, scope));
          bindings.push({ kind: 'text', node: tn, tpl: txt, chain: chain });
          frag.appendChild(tn);
        } else frag.appendChild(document.createTextNode(txt));
        continue;
      }
      if (src.nodeType !== 1) continue;
      var tag = src.tagName.toLowerCase();

      if (tag === 'sc-for') {
        var listExpr = bare(src.getAttribute('list'));
        var as = src.getAttribute('as');
        var arr = ev(scope, listExpr) || [];
        for (var k = 0; k < arr.length; k++) {
          frag.appendChild(renderNodes(src.childNodes, chain.concat([{ list: listExpr, as: as, index: k }]), vals));
        }
        continue;
      }
      if (tag === 'sc-if') {
        if (ev(scope, bare(src.getAttribute('value')))) {
          frag.appendChild(renderNodes(src.childNodes, chain, vals));
        }
        continue;
      }

      var el = document.createElement(tag);
      for (var a = 0; a < src.attributes.length; a++) {
        var at = src.attributes[a], name = at.name, val = at.value;
        if (name.indexOf('hint-') === 0) continue;
        if (name === 'style-hover') { el.classList.add(hoverClass(val)); continue; }
        if (name === 'sc-camel-on-click') {
          (function (el, expr) {
            el.__h = ev(scope, expr);
            el.addEventListener('click', function (e) {
              if (typeof el.__h === 'function') { e.preventDefault(); el.__h(e); }
            });
            bindings.push({ kind: 'handler', node: el, expr: expr, chain: chain });
          })(el, bare(val));
          continue;
        }
        if (val.indexOf('{{') > -1) {
          el.setAttribute(name, interp(val, scope));
          bindings.push({ kind: 'attr', node: el, attr: name, tpl: val, chain: chain });
        } else el.setAttribute(name, val);
      }
      el.appendChild(renderNodes(src.childNodes, chain, vals));
      frag.appendChild(el);
    }
    return frag;
  }

  function patch(vals) {
    for (var i = 0; i < bindings.length; i++) {
      var b = bindings[i], scope = makeScope(vals, b.chain), v;
      if (b.kind === 'text') { v = interp(b.tpl, scope); if (b.node.nodeValue !== v) b.node.nodeValue = v; }
      else if (b.kind === 'attr') { v = interp(b.tpl, scope); if (b.node.getAttribute(b.attr) !== v) b.node.setAttribute(b.attr, v); }
      else if (b.kind === 'handler') { b.node.__h = ev(scope, b.expr); }
    }
  }

  var comp = null;
  function chrome(vals) {
    var lang = comp.state.lang;
    document.documentElement.lang = lang;
    document.documentElement.dir = vals.dir;
    document.title = lang === 'ar'
      ? 'Green Arch — استوديو عمارة ولاندسكيب في السعودية'
      : 'Green Arch — Architecture & Landscape Studio in Saudi Arabia';
  }
  function full() {
    var vals = comp.renderVals();
    bindings = [];
    var frag = renderNodes(tplRoot.childNodes, [], vals);
    app.textContent = '';
    app.appendChild(frag);
    chrome(vals);
  }

  window.__GA = {
    boot: function (Component) {
      comp = new Component({ editorialGrid: true });
      comp.__onState = function (keys) {
        var onlyTick = keys.every(function (k) { return k === 'tick'; });
        if (onlyTick) patch(comp.renderVals()); else full();
      };
      full();
      if (comp.componentDidMount) comp.componentDidMount();
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && comp.state.open) comp.setState({ open: null });
      });
    }
  };
})();

function DCLogic(props) { this.props = props || {}; }
DCLogic.prototype.setState = function (patchArg) {
  var next = typeof patchArg === 'function' ? patchArg(this.state) : patchArg;
  var k;
  for (k in next) this.state[k] = next[k];
  if (this.__onState) this.__onState(Object.keys(next));
};

</script>

  componentWillUnmount() { clearInterval(this._t); }

  renderVals() {
    const lang = this.state.lang;
    const t = T[lang];
    const editorial = this.props.editorialGrid ?? true;
    const fi = this.state.filter;
    const tick = this.state.tick;
    const pick = (arr, off) => arr[(tick + off) % arr.length];
    const flat = P.map(p => gallery(p.slug)).flat();
    const list = P.filter(p => fi === 0 || p.ci === fi);
    const loc = (p) => ({ ...p[lang], slug: p.slug, cat: CATS[lang][p.ci] });

    return {
      t, dir: lang === "ar" ? "rtl" : "ltr",
      fontStack: lang === "ar" ? "'IBM Plex Sans Arabic',sans-serif" : "'Inter',sans-serif",
      toggleLang: () => this.setState({ lang: lang === "ar" ? "en" : "ar" }),
      heroA: pick(gallery("fursan"), 0),
      heroB: pick(gallery("majlis1"), 1),
      heroC: pick(gallery("hospital"), 2),
      cats: CATS[lang].map((label, i) => ({
        label: i === 0 ? label + (lang === "ar" ? " (١٥)" : " (15)") : label,
        bg: i === fi ? "#1C3627" : "transparent",
        fg: i === fi ? "#F4F1EA" : "#3A483C",
        onClick: () => this.setState({ filter: i })
      })),
      shown: list.map((p, i) => {
        const d = loc(p);
        return {
          ...d, title: d.t,
          img: pick(gallery(p.slug), i),
          span: editorial && i % 5 === 0 ? 2 : 1,
          ratio: editorial && i % 5 === 0 ? "16/9" : "4/5",
          details: [{ k: t.fLocation, v: d.place }, { k: t.fArea, v: d.area }, { k: t.fScope, v: d.scope }],
          onClick: () => this.setState({ open: p.slug })
        };
      }),
      active: (() => {
        const p = P.find(x => x.slug === this.state.open);
        if (!p) return false;
        const d = loc(p);
        return { ...d, title: d.t, img: pick(gallery(p.slug), 0) };
      })(),
      closeProject: () => this.setState({ open: null }),
      steps: t.steps, sectors: t.sectors, stats: t.stats, contacts: t.contacts,
      feed: [0, 1, 2, 3, 4, 5].map(i => flat[(tick * 6 + i * 7) % flat.length])
    };
  }
}


__GA.boot(Component);

</script>
</body>
</html>
